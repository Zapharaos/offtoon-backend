# Server configuration
server:
  # Specify the server host
  # Default value: "127.0.0.1"
  host: ""

  # Specify the server port
  # Default value: 3000
  port: 3000

logger:
  # Specify the logger configuration
  # Default value: "false"
  production: false

  # Specify the logger level
  # Default value: "info"
  level: debug

  # Lumberjack log rotation configuration
  rotation:
    # Specify the log file path
    # Default value: "logs/offtoon.log"
    filename: "logs/offtoon.log"

    # Specify the maximum size of the log file before rotation (in megabytes)
    # Default value: 10
    max_size: 10

    # Specify the maximum number of old log files to retain
    # Default value: 5
    max_backups: 5

    # Specify the maximum number of days to retain old log files
    # Default value: 30
    max_age: 30

    # Specify if rotated log files should be compressed
    # Default value: true
    compress: true

# Specify the timezone
# Default value: "Europe/Paris"
timezone: 'Europe/Paris'

# CORS configuration
cors:
  # Enable or disable CORS
  # Default value: true
  enabled: true

  # Specify allowed origins for CORS
  # Default value: ["https://*", "http://*"]
  allowed_origins:
    - "https://*"
    - "http://*"

  # Specify allowed methods for CORS
  # Default value: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"

  # Specify allowed headers for CORS
  # Default value: ["Accept", "Authorization", "Content-Type", "X-CSRF-Token"]
  allowed_headers:
    - "Accept"
    - "Authorization"
    - "Content-Type"
    - "X-CSRF-Token"

  # Allow credentials
  # Default value: false
  allow_credentials: false

  # Maximum age in seconds
  # Default value: 300
  max_age: 300

# Websockets
websocket:

  client:

    # Time allowed to read the next pong message from the peer.
    # Default value: 60 seconds
    pong_wait: 45

    # Send pings to peer with this period. Must be less than pongWait.
    # Set well below the frontend's inactivity timeout (30s) so long
    # archive builds don't cause the client to disconnect.
    ping_period: 20

    # Buffer size for the send channel to prevent blocking while allowing some buffering
    # Default value: 64
    send_channel_buffer_size: 64

    # Maximum consecutive send failures before considering the client disconnected
    # Default value: 10
    max_consecutive_send_failures: 10

# Set runtime configuration
toonruntime:
  # Channel capacity for client connections
  # Default value: 100
  client_chan_cap: 100

  # Channel capacity for data changes
  # Default value: 256
  change_chan_cap: 256

  # Event timeout duration (how long event stays active without activity)
  # Expressed as a Golang duration
  # Default value: "30m"
  timeout: "30m"

  # Client timeout duration (how long client stays connected without activity)
  # Since clients do not send data but only listen, this must be high enough to avoid early disconnects
  # Expressed as a Golang duration
  # Default value: "10m"
  client_timeout: "10m"

  # Frequency of client timeout checks
  # Expressed as a Golang duration
  # Default value: "30s"
  client_timeout_check_freq: "30s"

# Rate limiting configuration
rate_limit:

  # Enable or disable rate limiting globally
  # Default value: true
  enabled: true

  # Global rate limit applied to all endpoints (per IP)
  global:
    # Maximum number of requests allowed per window
    # Default value: 200
    max_requests: 200
    # Duration of the sliding window
    # Expressed as a Golang duration
    # Default value: "1m"
    window: "1m"

  # Per-endpoint rate limits (per IP)
  # These override the global limit for specific routes
  endpoints:

    # POST /api/v1/search
    search:
      max_requests: 30
      window: "1m"

    # POST /api/v1/fetch
    fetch:
      max_requests: 20
      window: "1m"

    # POST /api/v1/download  (starts a potentially long job — keep tight)
    download:
      max_requests: 5
      window: "1m"

# API clients configuration
clients:

  asura:
    urls:
      - "https://api.asurascans.com"
    throttle:
      # These values target the official JSON API (api.asurascans.com), which is
      # built to be called — unlike the old HTML site where we had to stay slow
      # and stealthy to avoid a ban. Warm API latency is ~110-120ms, so we pace
      # requests at ~3-5/s: fast enough to make the chapter-metadata phase quick,
      # polite enough not to trip Cloudflare's bot protection. The adaptive
      # throttle below auto-backs-off if the API starts slowing down.
      # Random delay range between requests (milliseconds)
      delay_min_ms: 150
      delay_max_ms: 400
      # Sliding-window rate limit — hard ceiling (~5 req/s) above the delay pacing,
      # acting as a burst safety net rather than the primary limiter.
      max_requests: 50
      window_seconds: 10
      # Retry / backoff
      max_attempts: 3
      initial_backoff_ms: 1000
      max_backoff_ms: 30000
      backoff_multiplier: 2.0
      # Adaptive throttling — baseline matches measured warm latency, so the
      # slow-traffic detector triggers if responses exceed ~3x (450ms).
      baseline_response_time_ms: 150
      slow_threshold_multiplier: 3.0
      adaptive_enabled: true

  nato:
    urls:
      - "https://natomanga.com"
      - "https://nelomanga.com"
      - "https://mangakakalot.gg"
      - "https://manganato.gg"
    throttle:
      # Random delay range between requests (milliseconds)
      delay_min_ms: 600
      delay_max_ms: 1800
      # Sliding-window rate limit
      max_requests: 10
      window_seconds: 60
      # Retry / backoff
      max_attempts: 3
      initial_backoff_ms: 1000
      max_backoff_ms: 30000
      backoff_multiplier: 2.0
      # Adaptive throttling
      baseline_response_time_ms: 350
      slow_threshold_multiplier: 3.0
      adaptive_enabled: true
